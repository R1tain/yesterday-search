name: Build Yesterday Search & Deploy to Koyeb

on:
  schedule:
    # 每天 UTC 03:00 (北京时间 11:00) 自动构建一次，拉取 SearXNG 官方最新引擎修复与防封补丁
    - cron: '0 3 * * *'
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'searxng/**'
      - 'assets/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lower case image tag
        run: |
          LOWER_TAG=$(echo "ghcr.io/${{ github.repository_owner }}/yesterday-search:latest" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_TAG=${LOWER_TAG}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          no-cache: true
          tags: ${{ env.IMAGE_TAG }}

      - name: Trigger Koyeb Redeploy
        if: ${{ env.KOYEB_WEBHOOK != '' }}
        env:
          KOYEB_WEBHOOK: ${{ secrets.KOYEB_DEPLOY_WEBHOOK }}
        run: |
          echo "Triggering Koyeb redeployment webhook..."
          curl -s -X POST "$KOYEB_WEBHOOK"
