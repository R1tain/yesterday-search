<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <rect width="128" height="128" rx="32" fill="#1E1B4B"/>
  
  <!-- Icon Group -->
  <g transform="translate(14, 14)">
    <!-- Lens -->
    <circle cx="45" cy="45" r="34" fill="none" stroke="url(#favGrad)" stroke-width="11" stroke-linecap="round"/>
    <!-- Clock Hands -->
    <line x1="45" y1="45" x2="30" y2="45" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
    <line x1="45" y1="45" x2="45" y2="30" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="45" cy="45" r="5.5" fill="#818CF8"/>
    <!-- Handle -->
    <line x1="70" y1="70" x2="92" y2="92" stroke="url(#favGrad)" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>