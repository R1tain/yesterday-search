use_default_settings: true

general:
  instance_name: "Yesterday Search"
  debug: false
  donation_url: false
  contact_url: false

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  formats:
    - html
    - json

server:
  secret_key: "%(ENV_SEARXNG_SECRET)s"
  limiter: false
  image_proxy: true
  method: "POST"

ui:
  static_use_hash: true
  default_theme: simple
  theme_args:
    simple_style: auto
  infinite_scroll: true
  results_on_new_tab: true

enabled_plugins:
  - Basic Calculator
  - Hash plugin
  - Hostnames plugin
  - Open Access DOI rewrite
  - Self Informations
  - Tracker URL remover
  - Unit converter plugin
